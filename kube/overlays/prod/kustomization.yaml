apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: institutional-defi

resources:
  - ../../base
  - configmap.yaml
  - ingress.yaml
  - egress-app.yaml

# Production replicas
replicas:
  - name: api
    count: 3
  - name: worker
    count: 2

# Production image tags (semantic version)
images:
  - name: institutional-defi-api
    newName: ${ECR_REGISTRY}/institutional-defi-api
    newTag: ${IMAGE_TAG}
  - name: institutional-defi-worker
    newName: ${ECR_REGISTRY}/institutional-defi-worker
    newTag: ${IMAGE_TAG}

commonLabels:
  environment: production

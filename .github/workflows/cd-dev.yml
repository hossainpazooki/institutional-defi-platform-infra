name: Deploy to Dev

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [deploy-dev]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: institutional-defi-eks
  NAMESPACE: institutional-defi-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROVISIONER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Deploy to EKS
        run: kubectl apply -k kube/overlays/dev/

      # api-dev/worker-dev rollouts and the /health smoke test were removed with
      # the institutional-defi-platform-api decommission. regulatory-workbench
      # is the only workload this overlay still deploys.
      - name: Restart Deployments
        run: kubectl -n $NAMESPACE rollout restart deployment/regulatory-workbench-dev

      - name: Wait for Rollout
        run: kubectl -n $NAMESPACE rollout status deployment/regulatory-workbench-dev --timeout=300s

      - name: Smoke Test
        run: |
          kubectl -n $NAMESPACE port-forward svc/regulatory-workbench-dev 8080:80 &
          sleep 5
          curl -sf http://localhost:8080/ > /dev/null
          echo "Smoke test passed"

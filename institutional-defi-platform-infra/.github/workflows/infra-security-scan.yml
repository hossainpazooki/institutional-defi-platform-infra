name: Infrastructure Security Scan

on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC
  pull_request:
    paths:
      - 'terraform/**'
      - 'kube/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  terraform-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov

      - name: Scan Terraform
        run: checkov -d terraform/ --framework terraform --output json --output-file checkov-terraform.json || true

      - name: Upload Terraform scan report
        uses: actions/upload-artifact@v4
        with:
          name: terraform-scan
          path: checkov-terraform.json

  kubernetes-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov

      - name: Scan Kubernetes manifests
        run: checkov -d kube/ --framework kubernetes --output json --output-file checkov-kube.json || true

      - name: Upload Kubernetes scan report
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-scan
          path: checkov-kube.json

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
